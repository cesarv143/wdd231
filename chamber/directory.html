            <nav id="nav-menu">
                <a href="index.html">Home</a>
                <a href="directory.html" class="active">Directory</a>
                <a href="#">Join</a>

                </label>
            </nav>
        </div>

    <main>
        <h1>Business Directory</h1>
        
        <div class="menu">
            <button id="grid" class="active">⣿ Grid</button>

        <div class="footer-center">

                <img src="images/socialmediain.png" alt="LinkedIn Page" class="social-icon">
            </a>

        <div class="footer-right">
            <p>WDD231 Class Project</p>
            <p>Cesar Velasco</p>
